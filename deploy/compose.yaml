name: classroom

services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    user: "${CLASSROOM_UID:-1000}:${CLASSROOM_GID:-1000}"
    environment:
      TZ: "${CLASSROOM_TZ:-Asia/Shanghai}"
    ports:
      - "0.0.0.0:${CLASSROOM_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: "${CLASSROOM_DATA_DIR:-./data}"
        target: /app/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/state', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
